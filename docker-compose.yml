# SPDX-License-Identifier: Apache-2.0
# Lattice-COP stack. Works unchanged on Docker Desktop (WSL2) and Docker Engine.
#
#   docker compose up -d                 ingest services + visualizer
#   docker compose --profile sdr up -d   the same, plus readsb on the RTL-SDR
#
# Everything a person opens is bound to 127.0.0.1. Images are built locally
# and must never be pushed to a registry: they contain the Lattice SDK.
name: lattice-cop

x-ingest: &ingest
  build:
    context: .
  image: lattice-cop:local
  env_file:
    - .env
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  ais-ingest:
    <<: *ingest
    command: ["ais-ingest"]

  adsb-ingest:
    <<: *ingest
    command: ["adsb-ingest"]

  # Anduril's Entity Visualizer sample app, unmodified. Its dev server forwards
  # the browser's entity stream to Lattice. The credentials below end up in the
  # page the browser loads, so this port must stay on 127.0.0.1.
  visualizer:
    build:
      context: docker/visualizer
    image: lattice-cop-visualizer:local
    environment:
      VITE_LATTICE_URL: ${LATTICE_URL:?Set LATTICE_URL in .env to your environment hostname, without https://}
      VITE_LATTICE_SANDBOX_TOKEN: ${LATTICE_SANDBOXES_TOKEN:-}
      VITE_LATTICE_BEARER_TOKEN: ${LATTICE_ENVIRONMENT_TOKEN:-}
      VITE_LATTICE_CLIENT_ID: ${LATTICE_CLIENT_ID:-}
      VITE_LATTICE_CLIENT_SECRET: ${LATTICE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:5173:5173"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # readsb + tar1090 from the upstream ultrafeeder image, unmodified (GPL-3.0).
  # Starts only with `--profile sdr`. It decodes the RTL-SDR and serves the
  # tar1090 map and aircraft.json. It feeds no aggregator: no ULTRAFEEDER_CONFIG
  # or MLAT settings are given. History, heatmap and graphs are off, and every
  # writable data path is a RAM disk, so no live data is stored.
  readsb:
    profiles:
      - sdr
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder@sha256:ed8a1395ad666d792d23e5306e468d12e91ff7b5a2c435fe8ff1868bbb7e3be5
    environment:
      TZ: UTC
      READSB_DEVICE_TYPE: rtlsdr
      # readsb's built-in automatic gain.
      READSB_GAIN: auto
      READSB_LAT: ${RECEIVER_LAT:-}
      READSB_LON: ${RECEIVER_LON:-}
      READSB_ALT: ${RECEIVER_ALT_M:-0}m
      # 0 keeps the antenna location out of the JSON that tar1090 serves.
      READSB_RX_LOCATION_ACCURACY: "0"
      # No download at start: tar1090 and the aircraft database stay as built into the image.
      UPDATE_TAR1090: "false"
      # Adds registration, type, operator and year to aircraft.json from the
      # tar1090-db database that ships inside the image.
      TAR1090_ENABLE_AC_DB: "true"
      GRAPHS1090_DISABLE: "true"
      READSB_ENABLE_HEATMAP: "false"
      READSB_ENABLE_TRACES: "false"
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run:exec,size=256M
      - /var/log:size=32M
      - /var/globe_history:size=64M
      - /var/lib/collectd:size=32M
    ports:
      - "127.0.0.1:8080:80"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
