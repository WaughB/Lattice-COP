version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project targets Python 3.14. Digest updates still come through.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directory: /docker/visualizer
    schedule:
      interval: weekly
    ignore:
      # Upstream tests the app on Node 24. Digest updates still come through.
      - dependency-name: node
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
